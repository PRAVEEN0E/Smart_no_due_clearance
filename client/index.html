<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="description" content="Efficient and automated No Due clearance system for educational institutions. Streamline the student clearance process with ease." />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://smart-no-due-clearance.vercel.app/" />
  <meta property="og:title" content="Smart No Due Clearance System" />
  <meta property="og:description" content="Streamline the student clearance process with our automated No Due system." />
  <meta property="og:image" content="/logo512.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://smart-no-due-clearance.vercel.app/" />
  <meta property="twitter:title" content="Smart No Due Clearance System" />
  <meta property="twitter:description" content="Streamline the student clearance process with our automated No Due system." />
  <meta property="twitter:image" content="/logo512.png" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <title>Smart No Due | Automated Student Clearance System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  </noscript>

  <style>
    :root {
      --primary: #7c3aed;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #fcfcfc;
      color: #1e293b;
      margin: 0;
      min-height: 100vh;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    }
    /* Premium Booting Screen */
    #root:empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #fcfcfc;
      overflow: hidden;
    }
    #root:empty::before {
      content: "";
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      border-radius: 24px;
      margin-bottom: 24px;
      box-shadow: 0 20px 40px rgba(124, 58, 237, 0.2);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    #root:empty::after {
      content: "SMART NO DUE";
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: #7c3aed;
      opacity: 0.8;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.9); opacity: 0.7; }
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
