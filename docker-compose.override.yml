services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npx nodemon server.js

  frontend:
    ports:
      - "5173:80"
    environment:
      NODE_ENV: development
    volumes:
      - ./client/dist:/usr/share/nginx/html
