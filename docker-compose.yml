services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sndc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sndc_secret}
      POSTGRES_DB: sndc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sndc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sndc-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sndc-net
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sndc:${DB_PASSWORD:-sndc_secret}@postgres:5432/sndc
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sndc-net
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 2
    networks:
      - sndc-net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  sndc-net:
    driver: bridge
